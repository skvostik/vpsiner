[package]
name = "vpsiner"
version = "0.0.1"
edition = "2024"

[profile.profiling]
inherits = "release" # Copies optimization settings from release
debug = true         # Keeps full debug symbols
strip = false        # Prevents removing symbols

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.47", features = ["full"] }
tower-http = { version = "0.7.0", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
async-trait = "0.1.92"
base64 = "0.23.1"
thiserror = "2.0.20"
futures-util = "0.3.34"
bytes = "1.12.1"
bollard = "0.21.1"
dashmap = "6.1"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio"] }
sysinfo = "0.39.6"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
mimalloc = { version = "0.1", default-features = false }
tokio-util = "0.7"

[dev-dependencies]
mockall = "0.15.0"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"

