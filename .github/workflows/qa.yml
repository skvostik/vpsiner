name: QA

on:
  # No paths filter: runs on every PR, so QA can be a required check.
  pull_request:
  # Pushes to main and tags run QA through publish.yml, before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend formatting
        working-directory: frontend
        run: npm run format:check

      - name: Check frontend types
        working-directory: frontend
        run: npm run typecheck

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt
          # Also caches ~/.cargo and target (Swatinem/rust-cache).

      - name: Check backend formatting
        run: cargo fmt --check

      - name: Run backend tests
        run: cargo test --locked

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Checks Cargo.lock against the RustSec advisory database. Trivy scans the
      # same crates in the image; this also reports unmaintained and yanked ones.
      - name: Audit Rust dependencies
        run: cargo audit

  trivy:
    runs-on: ubuntu-latest
    # Fork PRs get no secrets, so they cannot pull the dhi.io base images.
    # Dependabot PRs need DOCKERHUB_USERNAME and DOCKERHUB_TOKEN as Dependabot secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to Docker Hardened Images registry
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: vpsiner:scan
          cache-from: type=gha
          # Lets the publish job reuse these layers instead of rebuilding.
          cache-to: type=gha,mode=max

      # Scans the image that ships: Alpine packages and the Rust crates
      # (the Dockerfile embeds the crate list with `cargo auditable`).
      # Pinned by commit: trivy-action release tags were hijacked in 2026.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vpsiner:scan
          version: v0.76.2
          severity: HIGH,CRITICAL
          exit-code: "1"
