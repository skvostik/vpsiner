name: QA

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - frontend/**
      - src/**
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/publish.yml
      - .github/workflows/qa.yml

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache frontend dependencies
        id: frontend-deps-cache
        uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node24-frontend-node-modules-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-frontend-node-modules-

      - name: Install frontend dependencies
        if: steps.frontend-deps-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci

      - name: Check frontend formatting
        working-directory: frontend
        run: npm run format:check

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt

      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check backend formatting
        run: cargo fmt --check

      - name: Run backend tests
        run: cargo test --locked

  trivy:
    runs-on: ubuntu-latest
    # Fork PRs get no secrets, so they cannot pull the dhi.io base images.
    # Dependabot PRs need DOCKERHUB_USERNAME and DOCKERHUB_TOKEN as Dependabot secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to Docker Hardened Images registry
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: vpsiner:scan
          cache-from: type=gha

      # Scans the image that ships: the Rust binary's crates and the base image.
      # Pinned by commit: trivy-action release tags were hijacked in 2026.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vpsiner:scan
          version: v0.76.2
          severity: HIGH,CRITICAL
          exit-code: "1"
